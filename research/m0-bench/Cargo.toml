[package]
name = "m0-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Throwaway M0 spike: measure Parakeet ASR speed across execution providers on this machine."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rustls-tls to avoid OpenSSL build friction, matching jotter's pattern.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }

# All EP features compiled in; selected at runtime so one binary runs the whole matrix.
parakeet-rs = { version = "0.3.7", features = ["coreml", "webgpu"] }

[profile.release]
opt-level = 3
lto = "thin"
