version: 2

# Weekly update PRs. The 5-day cooldown matches the spirit of pnpm's minimumReleaseAge: a version
# is not proposed until it has been public long enough for a compromised release to be pulled.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # The npm Tauri packages must stay on the same minor as the `tauri` crate, or `tauri build`
    # refuses to run. Bump them by hand together with the Cargo side.
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Majors break the toolchain (TypeScript 7 is unsupported by typescript-eslint), so they
      # are upgraded by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "tauri"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # A 0.x minor is a breaking release under Cargo's rules (cpal 0.16 -> 0.18 renamed
      # Device::name), so those come by hand too.
      - dependency-name: "cpal"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "whisper-rs"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    cooldown:
      default-days: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
