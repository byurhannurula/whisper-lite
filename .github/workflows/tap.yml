name: Update Homebrew tap

# When a release is published (you flip the draft to published), hash the macOS DMG and push the
# updated version + sha256 into the whisper-lite cask in byurhannurula/homebrew-tap, so
# `brew upgrade --cask whisper-lite` picks it up.
#
# Requires a repo secret HOMEBREW_TAP_TOKEN: a fine-grained PAT with Contents: read/write on the
# byurhannurula/homebrew-tap repo. The default GITHUB_TOKEN cannot push to another repository.

on:
  release:
    types: [published]

jobs:
  cask:
    runs-on: macos-latest
    steps:
      - name: Get DMG + sha256
        id: dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          ver="${tag#v}"
          asset="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name | select(endswith(".dmg"))' | head -1)"
          if [ -z "$asset" ]; then
            echo "No .dmg asset on $tag — nothing to do."
            exit 0
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$asset" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        if: steps.dmg.outputs.sha != ''
        uses: actions/checkout@v7
        with:
          repository: byurhannurula/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # Writes the whole cask instead of patching version + sha256 in place, so the first release
      # creates the file and later ones cannot drift from this template.
      - name: Write cask + push
        if: steps.dmg.outputs.sha != ''
        env:
          VER: ${{ steps.dmg.outputs.ver }}
          SHA: ${{ steps.dmg.outputs.sha }}
          ASSET: ${{ steps.dmg.outputs.asset }}
        run: |
          # GitHub rewrites spaces in asset names ("Whisper Lite_…" uploads as "Whisper.Lite_…"),
          # so derive the URL from the real asset name rather than from productName.
          file="$(printf '%s' "$ASSET" | sed "s/$VER/#{version}/g")"
          mkdir -p tap/Casks
          cat > tap/Casks/whisper-lite.rb <<EOF
          cask "whisper-lite" do
            # Written by tap.yml in byurhannurula/whisper-lite on each published release.
            version "$VER"
            sha256 "$SHA"

            url "https://github.com/byurhannurula/whisper-lite/releases/download/v#{version}/$file"
            name "Whisper Lite"
            desc "Local, on-device dictation from the menu bar"
            homepage "https://github.com/byurhannurula/whisper-lite"

            depends_on macos: ">= :big_sur"

            app "Whisper Lite.app"

            # The build is not notarized, so Gatekeeper would block the first launch.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/Whisper Lite.app"]
            end

            uninstall quit: "com.byrhn.whisperlite"

            zap trash: [
              "~/Library/Application Support/whisper-lite",
              "~/Library/Application Support/com.byrhn.whisperlite",
              "~/Library/Caches/com.byrhn.whisperlite",
              "~/Library/LaunchAgents/Whisper Lite.plist",
              "~/Library/WebKit/com.byrhn.whisperlite",
            ]

            caveats <<~TXT
              Whisper Lite needs Microphone and Accessibility permission.
              The build is not code-signed, so after each upgrade macOS can forget the
              Accessibility grant. Re-enable it in System Settings → Privacy & Security
              → Accessibility if dictated text stops appearing.
            TXT
          end
          EOF
          cd tap
          git add Casks/whisper-lite.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git config user.name  "whisper-lite-release"
          git config user.email "actions@users.noreply.github.com"
          git commit -aqm "whisper-lite $VER"
          git push
