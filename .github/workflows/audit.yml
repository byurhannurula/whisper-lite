name: Audit

# Known-vulnerability scan for both ecosystems: weekly, on demand, and on any PR that changes a
# manifest or lockfile, so a risky bump is caught in review. Linux runners, since neither tool
# compiles anything and macOS minutes cost 10x.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  # Plain cargo-audit rather than rustsec/audit-check: that action needs checks/issues write
  # access, which Dependabot PRs never get, and it failed there with no message. Exits non-zero
  # on vulnerabilities only; unmaintained/unsound notices in Tauri's tree are printed, not fatal.
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock
